name: Sync Upstream

permissions: write-all              # grant write permission

on:
  schedule:
    # 说明：本仓库已深度定制（新增 LDC 积分站查询、浏览器内登录等），
    # 自动同步上游会产生冲突甚至覆盖定制内容，故关闭定时自动同步。
    # 如需手动同步上游，请到 Actions 页面手动触发本工作流并自行解决冲突。
    # - cron: '0 0 * * *'
  workflow_dispatch:                # trigger manually

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
            # REQUIRED 'target_repo_token' exactly like this!
            target_repo_token: ${{ secrets.GITHUB_TOKEN }}
            target_sync_branch: main
            upstream_sync_branch: main
            upstream_sync_repo: doveppp/linuxdo-checkin

            # Set test_mode true during manual dispatch to run tests instead of the true action!!
            test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次。"
          exit 1